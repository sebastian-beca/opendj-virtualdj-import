[package]
name = "opendj-addon-vdj"
description = "Private openDJ add-on: brings a VirtualDJ library into the collection"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
# openDJ's engine and plugin traits. Point these at the openDJ repository,
# or at a local checkout with `path = ".../crates/engine"` and so on.
# Until openDJ's imported-lists change is merged, this builds against its
# branch; switch back to the default branch after.
mixxx-engine = { git = "https://github.com/sebastian-beca/opendj", branch = "claude/project-thread-g90d1a" }
mixxx-plugins = { git = "https://github.com/sebastian-beca/opendj", branch = "claude/project-thread-g90d1a" }
roxmltree = "0.21"
